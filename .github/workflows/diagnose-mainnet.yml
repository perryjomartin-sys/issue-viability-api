name: Diagnose Base mainnet (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-viability-mainnet-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    environment: issue-viability-mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Inspect active mainnet deployment and version bindings
        run: node scripts/diagnose-mainnet.mjs
      - name: Check CDP facilitator support with runner-only credentials
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
        run: node scripts/diagnose-mainnet.mjs facilitator-support
      - name: Tail one unpaid mainnet request
        run: |
          set -euo pipefail
          tail_file="$RUNNER_TEMP/mainnet-tail.jsonl"
          trap 'rm -f "$tail_file"' EXIT
          timeout 45s npx wrangler tail --config wrangler.jsonc --env mainnet --format json --status error --method POST >"$tail_file" 2>&1 &
          tail_pid=$!
          sleep 5
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"repo":"cli/cli","issue":14297}' 'https://issue-viability-api-mainnet.agentactiongateway.workers.dev/v1/check?audit=github-actions')"
          printf 'Unpaid POST HTTP status: %s\n' "$status"
          wait "$tail_pid" || true
          node scripts/sanitise-mainnet-tail.mjs "$tail_file"
